# Kopieren nach data/config.yaml und anpassen.
# Entweder Geräte direkt (devices, ohne Home Assistant) oder über Home Assistant (home_assistant), nicht beides.
# devices:
#   - type: apsystems_ezhi   # Speicher, lokale API im lokalen Modus der APsystems-App
#     host: 192.168.1.20
#   - type: shelly_em        # Netzmessung, z. B. Shelly Pro 3EM (shelly_em1: Pro EM, EM Gen3)
#     host: 192.168.1.21
#   - type: shelly_plug      # Messung am Einspeisepunkt
#     host: 192.168.1.22
#     invert: [output_power] # nur falls der Plug die Abgabe negativ meldet
#   - type: opendtu          # Hoymiles über OpenDTU (ahoydtu: AhoyDTU), IP-Adresse der DTU
#     host: 192.168.1.23
#   - type: victron_modbus   # Victron GX über Modbus TCP (victron_mqtt: über MQTT), Port nach Doppelpunkt möglich
#     host: 192.168.1.24
# location: {lat: 50.0, lon: 10.0}   # Standort, für Prognose und Jahresverlauf ohne Home Assistant
# planes:                           # Flächen; Azimut 0 = Nord, 90 = Ost, 180 = Süd, 270 = West
#   - {declination: 30, azimuth: 150, kwp: 0.87, inverter: storage}  # Fläche am Speicher
#   - {declination: 30, azimuth: 250, kwp: 0.87, inverter: extra}    # Fläche am zusätzlichen Wechselrichter
home_assistant:
  url: http://homeassistant.local:8123
  token: LONG_LIVED_ACCESS_TOKEN
  # Messgröße: [Entität, Faktor]; Faktor -1 dreht das Vorzeichen (siehe Handbuch, Messquellen)
  entities:
    grid_power: [sensor.shellypro3em_total_active_power, 1]
    pv_power: [sensor.ezhi_photovoltaic_power, 1]
    pv_ac_power: [sensor.ezhi_off_grid_power, 1]
    battery_power: [sensor.ezhi_battery_power, 1]
    battery_soc: [sensor.ezhi_battery_state_of_charge, 1]
    output_power: [sensor.ezhi_on_grid_power, -1]
    output_energy: [sensor.solar_einspeisung_energy, 1]
    pv_energy: [sensor.ezhi_photovoltaic_energy, 1]
    battery_charge_energy: [sensor.ezhi_battery_total_charge_energy, 1]
    battery_discharge_energy: [sensor.ezhi_battery_total_discharge_energy, 1]
    # optional, für die Akku-Auswertung
    battery_capacity: [sensor.ezhi_battery_capacity, 1]
    battery_soh: [sensor.ezhi_battery_state_of_health, 1]
    battery_soc_min: [number.ezhi_soc_minimum, 1]
    battery_soc_max: [number.ezhi_soc_maximum, 1]
    battery_discharge_protection: [number.ezhi_discharge_protection, 1]
    output_power_limit: [sensor.ezhi_power_limit, 1]   # optional, eingestelltes Limit des Speichers
    # optional, Prognose „Erzeugung heute“ der Fläche am Speicher bzw. am zweiten Wechselrichter (Forecast.Solar)
    pv_forecast_today: [sensor.energy_production_today_2, 1]
    pv_ac_forecast_today: [sensor.energy_production_today, 1]
prices:
  energy: 0.30   # Arbeitspreis €/kWh
  feed_in: 0.0   # Einspeisevergütung €/kWh
system:
  cost: 0        # Anschaffungskosten €
