[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "balkonaut"
version = "0.1.0"
description = "Analyse- und Entscheidungstool für Balkonkraftwerke mit Speicher"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
app = ["fastapi>=0.151", "uvicorn>=0.54", "jinja2>=3.1", "pyyaml>=6.0"]
dev = ["pytest>=9.1", "httpx2>=2.15"]
# ponytail: MkDocs 2.0 bricht Material for MkDocs, daher <2. Bei P4 prüfen, ob Zensical (Nachfolger vom Material-Team) stabil ist.
docs = ["mkdocs-material>=9.7", "mkdocs>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
pythonpath = ["."]
