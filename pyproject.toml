[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "balkonaut"
version = "1.0.3-beta.2"
description = "Analyse- und Entscheidungstool für Balkonkraftwerke mit Speicher"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.1"]
# Vereinfachung: MkDocs 2.0 bricht Material for MkDocs, daher <2. Bei P4 prüfen, ob Zensical (Nachfolger vom Material-Team) stabil ist.
docs = ["mkdocs-material>=9.7", "mkdocs>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # tests_ha braucht Home Assistant, eigener Lauf
