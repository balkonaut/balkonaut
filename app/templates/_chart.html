{% set n = chart.bars|length %}{% set w = 480 / n %}{% set every = ((n + 11) // 12) %}
<svg viewBox="0 0 480 170" role="img" aria-label="Hausverbrauch je Zeitabschnitt, aufgeteilt in Balkonkraftwerk und Netzbezug, mit Erzeugung">
  {% for h in chart.bars %}
    {% set x = loop.index0 * w + w * 0.1 %}
    <rect x="{{ x }}" y="{{ 150 - h.own * chart.scale }}" width="{{ w * 0.8 }}" height="{{ h.own * chart.scale }}" fill="var(--leaf)"><title>{{ h.label }}: {{ h.own|de(2) }} kWh vom Balkonkraftwerk</title></rect>
    <rect x="{{ x }}" y="{{ 150 - (h.own + h.grid) * chart.scale }}" width="{{ w * 0.8 }}" height="{{ h.grid * chart.scale }}" fill="var(--sun)"><title>{{ h.label }}: {{ h.grid|de(2) }} kWh aus dem Netz</title></rect>
    {% if h.gen %}<rect x="{{ x }}" y="{{ 149 - h.gen * chart.scale }}" width="{{ w * 0.8 }}" height="2" fill="var(--ink)"><title>{{ h.label }}: {{ h.gen|de(2) }} kWh erzeugt</title></rect>{% endif %}
    {% if loop.index0 % every == 0 %}<text x="{{ x + w * 0.4 }}" y="166" font-size="10" text-anchor="middle" fill="var(--muted)">{{ h.label }}</text>{% endif %}
  {% endfor %}
</svg>
<div class="legend"><span><i class="dot" style="background:var(--leaf)"></i>Balkonkraftwerk</span><span><i class="dot" style="background:var(--sun)"></i>Netz</span><span><i class="dot" style="background:var(--ink);height:.2rem"></i>Erzeugung</span><span>höchster Wert {{ chart.peak|de(2) }} kWh</span></div>
