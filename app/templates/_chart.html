{% set n = chart.bars|length %}{% set left = 36 %}{% set w = (480 - left) / n %}{% set every = ((n + 11) // 12) %}
<svg viewBox="0 0 480 170" role="img" aria-label="Hausverbrauch je Zeitabschnitt, aufgeteilt in Balkonkraftwerk und Netzbezug, mit Erzeugung">
  <text x="0" y="8" font-size="9" fill="var(--muted)" font-family="var(--mono)">kWh</text>
  {% for value, label in chart.ticks %}
    <line x1="{{ left }}" x2="480" y1="{{ 150 - value * chart.scale }}" y2="{{ 150 - value * chart.scale }}" stroke="var(--line)" stroke-width="1"/>
    <text x="{{ left - 4 }}" y="{{ 153 - value * chart.scale }}" font-size="9" text-anchor="end" fill="var(--muted)">{{ label }}</text>
  {% endfor %}
  <line x1="{{ left }}" x2="480" y1="150" y2="150" stroke="var(--muted)" stroke-width="1"/>
  {% for h in chart.bars %}
    {% set x = left + loop.index0 * w + w * 0.1 %}
    <rect x="{{ x }}" y="{{ 150 - h.own * chart.scale }}" width="{{ w * 0.8 }}" height="{{ h.own * chart.scale }}" fill="var(--leaf)"><title>{{ h.label }}: {{ h.own|de(2) }} kWh vom Balkonkraftwerk</title></rect>
    <rect x="{{ x }}" y="{{ 150 - (h.own + h.grid) * chart.scale }}" width="{{ w * 0.8 }}" height="{{ h.grid * chart.scale }}" fill="var(--sky)"><title>{{ h.label }}: {{ h.grid|de(2) }} kWh aus dem Netz</title></rect>
    {% if h.gen %}<rect x="{{ x }}" y="{{ 149 - h.gen * chart.scale }}" width="{{ w * 0.8 }}" height="3" fill="var(--sun)"><title>{{ h.label }}: {{ h.gen|de(2) }} kWh erzeugt</title></rect>{% endif %}
    {% if loop.index0 % every == 0 %}<text x="{{ x + w * 0.4 }}" y="166" font-size="10" text-anchor="middle" fill="var(--muted)">{{ h.label }}</text>{% endif %}
  {% endfor %}
</svg>
<div class="legend"><span><i class="dot" style="background:var(--leaf)"></i>Balkonkraftwerk</span><span><i class="dot" style="background:var(--sky)"></i>Netz</span><span><i class="dot" style="background:var(--sun);height:4px;vertical-align:3px"></i>Erzeugung</span></div>
