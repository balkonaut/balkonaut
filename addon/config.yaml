# https://contributors.home-assistant.io/apps/reference/configuration/
# version ist zugleich der Image-Tag; die GitHub-Action baut ihn, sobald er sich hier ändert.
name: Balkonaut
version: "0.1.1"
slug: balkonaut
description: Analyse- und Entscheidungstool für Balkonkraftwerke mit Speicher
url: "https://github.com/balkonaut/balkonaut"
arch:
  - aarch64
  - amd64
image: "ghcr.io/balkonaut/balkonaut"
homeassistant_api: true
ingress: true
ingress_port: 8000
panel_icon: mdi:solar-power-variant
panel_title: Balkonaut
options:
  entities: {}
  invert: []
schema:
  entities:
    grid_power: "str?"
    pv_power: "str?"
    pv_ac_power: "str?"
    battery_power: "str?"
    battery_soc: "str?"
    output_power: "str?"
    output_energy: "str?"
    pv_energy: "str?"
    battery_charge_energy: "str?"
    battery_discharge_energy: "str?"
    battery_capacity: "str?"
    battery_soh: "str?"
    battery_soc_min: "str?"
    battery_soc_max: "str?"
    battery_discharge_protection: "str?"
    output_power_limit: "str?"
    pv_forecast_today: "str?"
    pv_ac_forecast_today: "str?"
  invert:
    - "list(grid_power|pv_power|pv_ac_power|battery_power|output_power)"
