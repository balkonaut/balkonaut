services:
  balkonaut:
    image: ghcr.io/balkonaut/balkonaut:latest
    # Selbst bauen statt fertiges Image: nächste Zeile aktivieren, dann docker compose up -d --build
    # build: .
    ports:
      - "${BALKONAUT_PORT:-8000}:8000"
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./data:/data
    restart: unless-stopped
