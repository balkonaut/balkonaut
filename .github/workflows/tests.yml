# Tests von App und Kern sowie der Home-Assistant-Integration, wie in den Teststufen des Dockerfile.
# docker.yml ruft diesen Workflow auf und baut das Image nur, wenn er bestanden ist.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test .
  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target ha-test .
