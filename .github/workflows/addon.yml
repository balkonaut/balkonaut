# Image des Home-Assistant-Add-ons für amd64 und aarch64 bauen und nach ghcr.io schieben.
# Tag = version aus addon/config.yaml; ein vorhandener Tag wird nie überschrieben. Nur nach bestandenen Tests.
name: Add-on

on:
  push:
    branches: [main]
    paths: [addon/config.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version lesen
        id: v
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"/\1/p' addon/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Schon gebaut?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
        if: steps.exists.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.skip != 'true'
      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
