site_name: Balkonaut Handbuch
# Link „Zurück zu Balkonaut“ zeigt aus dem Handbuch hinaus, ist also keine Datei in docs/
validation:
  nav:
    not_found: info
nav:
  - index.md
  - installation.md
  - Docker-App:
    - docker.md
    - einstellungen.md
  - Home-Assistant-Integration: integration.md
  - geraete.md
  - auswertung.md
  - messquellen.md
  - schnittstelle.md
  - geplant.md
  - Zurück zu Balkonaut: ../
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Helles Design
extra:
  homepage: ../  # Logo führt zurück in die App (Handbuch liegt unter /handbuch/)
  social:
    - icon: fontawesome/solid/mug-hot
      link: https://buymeacoffee.com/balkonaut
      name: Balkonaut unterstützen
markdown_extensions:
  - admonition
