# Mocks als vollständiger Stack, z. B. in Dockhand (Compose einfügen, keine weiteren Dateien nötig):
# - mosquitto: MQTT-Broker wie auf dem GX, Port 1883
# - gx: nachgebauter GX (MQTT und Modbus TCP Port 502) mit simulierter Anlage
# - history: füllt beim ersten Start 40 Tage Verlauf in die Test-Datenbank, danach ohne Wirkung
# - balkonaut-test: eigene Balkonaut-Instanz auf Port 8001, getrennt von der echten Anlage
# - opendtu, ahoydtu: Hoymiles HM-800 und HMS-800W-2T hinter OpenDTU (Port 8091) bzw. AhoyDTU (Port 8092);
#   in Balkonaut als Gerät mit Adresse <Rechner>:8091 bzw. <Rechner>:8092 eintragen
# - balkonaut-hoymiles: zweite Balkonaut-Instanz auf Port 8002, liest nur den Hoymiles-Mock (OpenDTU), ohne Verlauf
# - deye-micro: Deye SUN800G3 mit Statusseite des Sticks, Port 8093 (Anmeldung admin/admin)
# - deye-hybrid: Deye-Hybrid einphasig mit Akku, Logger-Stick mit Solarman V5 auf Port 8899 und Suche auf UDP 48899
# - balkonaut-deye: dritte Balkonaut-Instanz auf Port 8003, liest nur den Deye-Hybrid, ohne Verlauf
# Der Code des Mocks kommt von GitHub, fest auf einen Commit (MOCK_REF), damit nie ungeprüfter Code läuft.
# Eine andere Balkonaut-Instanz liest den Mock über die IP-Adresse dieses Rechners.
# Nur zum Testen im Heimnetz: Broker und Modbus ohne Anmeldung, nicht ins Internet freigeben.
# Anpassbar über Umgebungsvariablen bzw. .env: MQTT_PORT, MODBUS_PORT, TEST_PORT, HOYMILES_TEST_PORT, OPENDTU_PORT, AHOYDTU_PORT,
# DEYE_TEST_PORT, DEYE_MICRO_PORT, SPEED, WEATHER, DAYS, TZ, MOCK_REF. Deye-Hybrid fest auf 8899 und 48899 (wie am Stick).
x-mock: &mock
  MOCK_URL: https://raw.githubusercontent.com/balkonaut/balkonaut/${MOCK_REF:-fc6b954ff70baf5e70b47a6dcfb8d050ccd8f29f}/tools/victron-mock/gx.py
  HOYMILES_URL: https://raw.githubusercontent.com/balkonaut/balkonaut/${MOCK_REF:-fc6b954ff70baf5e70b47a6dcfb8d050ccd8f29f}/tools/victron-mock/hoymiles.py
  DEYE_URL: https://raw.githubusercontent.com/balkonaut/balkonaut/${MOCK_REF:-fc6b954ff70baf5e70b47a6dcfb8d050ccd8f29f}/tools/victron-mock/deye.py
  TZ: ${TZ:-Europe/Berlin}

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "${MQTT_PORT:-1883}:1883"
    restart: unless-stopped

  gx:
    image: python:3.12-slim
    environment:
      <<: *mock
      PORTAL_ID: ${PORTAL_ID:-c0619ab00000}
      SPEED: ${SPEED:-1}          # 1 = Echtzeit, 60 = eine Stunde je Minute
      WEATHER: ${WEATHER:-auto}   # auto, sonnig, wechselhaft, bedeckt
    command: >
      sh -c "pip install --quiet --no-cache-dir --root-user-action=ignore paho-mqtt==2.1.0
      && python -c \"import os, urllib.request; urllib.request.urlretrieve(os.environ['MOCK_URL'], '/gx.py')\"
      && exec python -u /gx.py"
    ports:
      - "${MODBUS_PORT:-502}:502"
    depends_on:
      - mosquitto
    restart: unless-stopped

  history:
    image: ghcr.io/balkonaut/balkonaut:latest
    environment:
      <<: *mock
      DAYS: ${DAYS:-40}
    command: >
      sh -c "python -c \"import os, urllib.request; urllib.request.urlretrieve(os.environ['MOCK_URL'], '/srv/gx.py')\"
      && python /srv/gx.py history"
    volumes:
      - test-data:/data
    restart: "no"

  balkonaut-test:
    image: ghcr.io/balkonaut/balkonaut:latest
    environment:
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${TEST_PORT:-8001}:8000"
    volumes:
      - test-data:/data
    depends_on:
      history:
        condition: service_completed_successfully
      gx:
        condition: service_started
    restart: unless-stopped

  opendtu: &hoymiles
    image: python:3.12-slim
    environment:
      <<: *mock
      DTU: opendtu
      SPEED: ${SPEED:-1}
      WEATHER: ${WEATHER:-auto}
    working_dir: /srv
    command: >
      sh -c "python -c \"import os, urllib.request as u; u.urlretrieve(os.environ['MOCK_URL'], 'gx.py');
      u.urlretrieve(os.environ['HOYMILES_URL'], 'hoymiles.py')\" && exec python -u hoymiles.py"
    ports:
      - "${OPENDTU_PORT:-8091}:80"
    restart: unless-stopped

  ahoydtu:
    <<: *hoymiles
    environment:
      <<: *mock
      DTU: ahoydtu
      SPEED: ${SPEED:-1}
      WEATHER: ${WEATHER:-auto}
    ports:
      - "${AHOYDTU_PORT:-8092}:80"

  balkonaut-hoymiles:
    image: ghcr.io/balkonaut/balkonaut:latest
    environment:
      TZ: ${TZ:-Europe/Berlin}
    # beim ersten Start Zuordnung auf den OpenDTU-Mock (AhoyDTU: in den Einstellungen Adresse ahoydtu eintragen)
    command: >
      sh -c "python -c \"from app import config; p = config.data_dir() / 'config.yaml'; p.exists() or config.save(p,
      {'devices': [{'type': 'opendtu', 'host': 'opendtu'}], 'location': {'lat': 50.0, 'lon': 10.0},
      'planes': [{'declination': 30, 'azimuth': 180, 'kwp': 1.68, 'inverter': 'storage'}],
      'prices': {'energy': 0.32, 'feed_in': 0.0}, 'system': {'cost': 600.0}})\"
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${HOYMILES_TEST_PORT:-8002}:8000"
    volumes:
      - hoymiles-data:/data
    depends_on:
      - opendtu
    restart: unless-stopped

  deye-micro: &deye
    image: python:3.12-slim
    environment:
      <<: *mock
      DEYE: micro
      SPEED: ${SPEED:-1}
      WEATHER: ${WEATHER:-auto}
    working_dir: /srv
    command: >
      sh -c "python -c \"import os, urllib.request as u; u.urlretrieve(os.environ['MOCK_URL'], 'gx.py');
      u.urlretrieve(os.environ['DEYE_URL'], 'deye.py')\" && exec python -u deye.py"
    ports:
      - "${DEYE_MICRO_PORT:-8093}:80"
    restart: unless-stopped

  deye-hybrid:
    <<: *deye
    environment:
      <<: *mock
      DEYE: hybrid
      SPEED: ${SPEED:-1}
      WEATHER: ${WEATHER:-auto}
    ports:
      - "8899:8899"
      - "48899:48899/udp"

  balkonaut-deye:
    image: ghcr.io/balkonaut/balkonaut:latest
    environment:
      TZ: ${TZ:-Europe/Berlin}
    # beim ersten Start Zuordnung auf den Deye-Hybrid (Mikrowechselrichter: in den Einstellungen Adresse deye-micro)
    command: >
      sh -c "python -c \"from app import config; p = config.data_dir() / 'config.yaml'; p.exists() or config.save(p,
      {'devices': [{'type': 'deye_hybrid', 'host': 'deye-hybrid'}], 'location': {'lat': 50.0, 'lon': 10.0},
      'planes': [{'declination': 30, 'azimuth': 180, 'kwp': 1.8, 'inverter': 'storage'}],
      'prices': {'energy': 0.32, 'feed_in': 0.0}, 'system': {'cost': 2500.0}})\"
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${DEYE_TEST_PORT:-8003}:8000"
    volumes:
      - deye-data:/data
    depends_on:
      - deye-hybrid
    restart: unless-stopped

volumes:
  test-data:
  hoymiles-data:
  deye-data:
