name: Testen und Image bauen

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker-CLI bereitstellen
        run: command -v docker || (apt-get update && apt-get install -y docker.io)
      - name: Tests (Python wie im Container)
        run: docker build --target test .
      # Der Runner entfernt Container, die ein Job startet; ausgerollt wird deshalb außerhalb des Jobs.
      - name: Image bauen
        run: docker build -t balkonaut:latest .
