name: Testen

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker-CLI bereitstellen
        run: command -v docker || (apt-get update && apt-get install -y docker.io)
      - name: Tests (Python wie im Container)
        run: docker build --target test .
      - name: Tests der Home-Assistant-Integration
        run: docker build --target ha-test .
      - name: hassfest
        run: docker build --target hassfest .
      # Das Image für Docker und NAS baut GitHub (ghcr.io/balkonaut/balkonaut:latest), hier nur das Handbuch prüfen
      - name: Handbuch
        run: docker build --target docs .
